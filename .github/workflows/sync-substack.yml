name: Sync Substack posts

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-substack-posts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test the importer
        run: python -m unittest tests/test_sync_substack.py

      - name: Sync the feed
        run: python scripts/sync_substack.py

      - name: Commit new posts
        id: commit
        run: |
          if git diff --quiet -- blog/index.html blog/substack-posts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/index.html blog/substack-posts.json
          git commit -m "Sync Substack posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the updated site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
